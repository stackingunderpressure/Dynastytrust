[package]
name = "dynastytrust_compiler"
version = "0.1.0"
edition = "2021"

[dependencies]
dynastytrust_protocol = { path = "../protocol" }
miniscript = "11"
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
bitcoin = { version = "0.31", features = ["rand"] }
hex = "0.4"
