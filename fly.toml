# DynastyTrust — Compiler Service
# fly.toml lives at the REPO ROOT so the Docker build context is
# the repo root (required for `COPY protocol/Cargo.toml ...` in
# compiler/Dockerfile). The dockerfile path below is relative to
# this file.
# Deploy: fly deploy
# First time: fly launch

app            = "dynastytrust-compiler"
primary_region = "mia"

# Build from repo root so Docker COPY paths work correctly
[build]
  dockerfile = "compiler/Dockerfile"

[env]
  PORT = "8080"

# COMPILER_SECRET must be set as a Fly secret:
#   fly secrets set COMPILER_SECRET=<your-random-secret>
# Generate one with: openssl rand -hex 32

[http_service]
  internal_port    = 8080
  force_https      = true
  auto_stop_machines  = "stop"   # Scale to zero when idle (saves $)
  auto_start_machines = true     # Wake on first request (~2s cold start)
  min_machines_running = 1       # Keep 1 always warm — avoids cold start timeout

  [http_service.concurrency]
    type       = "requests"
    hard_limit = 50
    soft_limit = 25

[[vm]]
  cpu_kind  = "shared"
  cpus      = 1
  memory_mb = 512
