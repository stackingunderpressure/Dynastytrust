[build]
  # apps/web depends on three sibling workspace packages
  # (bip341-psbt-signer, nostr-transport, policy-engine), each of which
  # is only resolvable once its own `tsc` build has produced dist/index.js
  # (their package.json "main"). It also depends on `tapit-attest`
  # (apps/web/package.json: "tapit-attest": "file:../../tapit-attest"),
  # a file: dependency living at the repo root, OUTSIDE the
  # `workspaces` glob (["apps/*", "packages/*"]) -- so root `npm
  # install` never installs tapit-attest's own devDependencies (it
  # has its own package-lock.json) and never runs its `tsc` build.
  # Build order: install + build the three workspace packages, then
  # separately install + build tapit-attest (via --prefix, since it
  # isn't a workspace member), then build the app last.
  command = "npm install && npm run build --workspace=@dynastytrust/bip341-psbt-signer --workspace=@dynastytrust/nostr-transport --workspace=@dynastytrust/policy-engine && npm --prefix tapit-attest install && npm --prefix tapit-attest run build && npm run build --workspace=@dynastytrust/web"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[plugins]]
  package = "@netlify/plugin-functions-install-core"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
