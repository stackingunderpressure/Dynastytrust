[build]
  # apps/web depends on four sibling workspace packages
  # (bip341-psbt-signer, nostr-transport, policy-engine, nip44), each of
  # which is only resolvable once its own `tsc` build has produced
  # dist/index.js (their package.json "main"). It also depends on
  # `tapit-attest` (apps/web/package.json: "tapit-attest":
  # "file:../../tapit-attest"), a file: dependency living at the repo
  # root, OUTSIDE the `workspaces` glob (["apps/*", "packages/*"]) -- so
  # root `npm install` never installs tapit-attest's own devDependencies
  # (it has its own package-lock.json) and never runs its `tsc` build.
  # Build order: install + build the four workspace packages, then
  # separately install + build tapit-attest (via --prefix, since it
  # isn't a workspace member), then build the app last.
  #
  # nip44 was added 2026-08-08 (Cut B3) and left out of this list at the
  # time -- Netlify's fresh clone has no dist/ checked in for it, so
  # Vite's resolver failed with "Failed to resolve entry for package
  # @dynastytrust/nip44" even though it built fine locally, where a
  # prior `npm run build` in packages/nip44 had already left a dist/
  # behind. Every workspace package apps/web imports MUST be listed
  # here, or a from-scratch build (Netlify, a fresh clone, CI) breaks
  # even when a dev machine's leftover dist/ hides the same gap.
  # npm ci (not npm install): installs exactly what package-lock.json
  # pins and fails loudly on any drift between the lockfile and
  # package.json, instead of npm install's willingness to silently
  # resolve a newer semver-compatible version -- more tamper-resistant
  # against a quietly-bumped dependency, no downside in a CI build
  # context since nothing here needs to WRITE a lockfile.
  command = "npm ci && npm run build --workspace=@dynastytrust/bip341-psbt-signer --workspace=@dynastytrust/nostr-transport --workspace=@dynastytrust/policy-engine --workspace=@dynastytrust/nip44 && npm --prefix tapit-attest ci && npm --prefix tapit-attest run build && npm run build --workspace=@dynastytrust/web"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[plugins]]
  package = "@netlify/plugin-functions-install-core"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers. This is a money-touching app whose softest attack
# surface is the browser itself -- an XSS bug, a malicious extension, or a
# supply-chain-compromised npm dependency getting a shot at an unlocked
# secure-mode key or a test-mode plaintext mnemonic straight out of
# localStorage. A CSP that only allows script execution from this origin
# closes off the most common of those paths (injected/inline third-party
# script) without touching app behavior -- no inline <script> tags or eval
# are used anywhere in this codebase.
[[headers]]
  for = "/*"
  [headers.values]
    # connect-src allows wss: broadly (not a fixed relay list) because Nostr
    # relay choice is deliberately user-configurable (nostrRelayPrefs.ts --
    # "a family that wants to run its own relay") -- enumerating specific
    # relay hosts here would silently break that feature for anyone who
    # points it elsewhere. mempool.space covers balance/broadcast/explorer
    # lookups (config.ts's EXPLORER); *.supabase.co covers auth + the DB.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://mempool.space wss:; font-src 'self' data: https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"
