[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dynastytrust-krux"
version = "0.1.0"
description = "Narrow-scope Taproot trust-policy signing extension for Krux"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
dependencies = [
    # Matches what Krux bundles. Bumping requires re-auditing the taptree/miniscript
    # paths on the target Krux release.
    "embit>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
