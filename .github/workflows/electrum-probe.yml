name: Electrum probe
# Dev tool (docs/chain-lookups-build-note.md): which public Electrum servers
# answer. Runs only when the probe itself changes; touches nothing live.
on:
  push:
    paths:
      - "scripts/electrum-probe.mjs"
      - "scripts/electrum-live.mjs"
      - "netlify/functions/_electrum.js"
      - ".github/workflows/electrum-probe.yml"
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/electrum-live.mjs
