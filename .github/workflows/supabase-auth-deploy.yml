name: Supabase auth deploy (manual, review before running)

# Pushes the branded, code-only login email templates in
# supabase/templates/ to the live project via the Supabase Management
# API (PATCH /v1/projects/{ref}/config/auth), token only, no CLI. See
# scripts/supabase-auth-deploy.sh's header for the field-name caveat
# on the confirmation/recovery templates.
#
# Deliberately workflow_dispatch only, never automatic on push: this
# PATCHes live auth configuration that real users depend on to sign
# in. Review supabase/templates/*.html before the first run.
#
# Same required secret/variable as supabase-db-deploy.yml (see that
# file's header for exactly what to add and where).

on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      MAGIC_LINK_SUBJECT: "Your DynastyTrust sign-in code"
      CONFIRMATION_SUBJECT: "Confirm your DynastyTrust account"
      RECOVERY_SUBJECT: "Your DynastyTrust password reset code"
    steps:
      - uses: actions/checkout@v4
      - name: Verify required config is present
        run: |
          missing=0
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && echo "::error::Missing secret SUPABASE_ACCESS_TOKEN" && missing=1
          [ -z "$SUPABASE_PROJECT_REF" ] && echo "::error::Missing repository variable SUPABASE_PROJECT_REF" && missing=1
          if [ "$missing" = "1" ]; then
            echo "::error::See supabase-db-deploy.yml's header comment for exactly what to add and where."
            exit 1
          fi
      - name: Push login-code email templates
        run: bash scripts/supabase-auth-deploy.sh
