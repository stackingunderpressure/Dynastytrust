name: Supabase DB bootstrap (one-time, run by hand)

# Run this ONCE, manually, before supabase-db-deploy.yml's first
# automatic push-to-main run. Marks every migration currently in
# supabase/migrations/ as already-applied in the tracking table
# WITHOUT running any of their SQL -- these files were all already
# applied by hand (pasted into the Supabase SQL editor) over the life
# of this project, before this pipeline existed. See
# scripts/supabase-migrate-bootstrap.sh's header for the full
# reasoning, including the one historical migration that is NOT safe
# to blindly re-run.
#
# Safe to re-run: marking an already-recorded version is a no-op.
# Never runs automatically (workflow_dispatch only) -- this is a
# one-time adoption step, not a normal deploy action.
#
# ONE THING TO VERIFY BEFORE RUNNING THIS: every file except the
# newest one (20260816194321_repair_ranged_descriptor_notation.sql)
# was confirmed applied by hand earlier in this project's life. That
# newest one was handed to you as SQL to paste into the Supabase SQL
# editor, but this workflow has no record of whether you actually ran
# it yet. If you're not certain, either run it once by hand first (it
# is idempotent -- a second run is a harmless no-op) before triggering
# this bootstrap, or skip that one file's version when running
# bootstrap and let supabase-db-deploy.yml apply it for real on the
# next push. Marking it "already applied" here when it was never
# actually run would silently leave the live database missing that
# fix forever, since the automated pipeline would then never touch it
# again.
#
# Same required secret/variable as supabase-db-deploy.yml (see that
# file's header for exactly what to add and where).

on:
  workflow_dispatch: {}

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify required config is present
        run: |
          missing=0
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && echo "::error::Missing secret SUPABASE_ACCESS_TOKEN" && missing=1
          [ -z "$SUPABASE_PROJECT_REF" ] && echo "::error::Missing repository variable SUPABASE_PROJECT_REF" && missing=1
          if [ "$missing" = "1" ]; then
            echo "::error::See supabase-db-deploy.yml's header comment for exactly what to add and where."
            exit 1
          fi
      - name: Mark every pre-existing migration as already applied
        run: bash scripts/supabase-migrate-bootstrap.sh
