# Live check for email-free accounts (docs/key-signin-build-note.md):
# throwaway accounts at never-mailed addresses, logged into by one-time
# token and by password, then deleted. Reads the SUPABASE_ACCESS_TOKEN
# secret; the admin key it fetches is masked and never leaves the runner.
#
# HAND-RUN ONLY since 2026-11-13 (threat model item D,
# docs/threat-model-2026-11-13.md): it used to run on every push to the
# working branch, which let anything able to push there run code holding the
# database master token. Start it from the Actions tab when it is needed.
name: Key sign-in placeholder test

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read auth settings (read-only, no secrets printed)
        run: node scripts/supabase-auth-settings-read.mjs
      - name: Placeholder account, one-time login, delete
        run: node scripts/key-signin-placeholder-test.mjs
