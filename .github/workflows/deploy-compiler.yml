name: Deploy Fly.io compiler

# Builds and deploys the Rust compiler service to Fly.io whenever
# its sources or the shared protocol crate change on main. Also
# runnable on demand from the Actions tab (workflow_dispatch).
#
# Requires a repository secret: FLY_API_TOKEN
#   fly tokens create deploy -x 999999h

on:
  push:
    branches: [main]
    paths:
      - "compiler/**"
      - "protocol/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/deploy-compiler.yml"
  workflow_dispatch:

concurrency:
  group: fly-compiler
  cancel-in-progress: false

jobs:
  deploy:
    name: fly deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Verify FLY_API_TOKEN reaches the runner
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::FLY_API_TOKEN secret is empty or not exposed to this job."
            echo "Check: https://github.com/stackingunderpressure/Dynastytrust/settings/secrets/actions"
            echo "Must be a Repository secret named exactly FLY_API_TOKEN (case-sensitive)."
            exit 1
          fi
          echo "Token length: ${#FLY_API_TOKEN}"
          echo "Token prefix: ${FLY_API_TOKEN:0:6}..."
      - run: flyctl deploy --config compiler/fly.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
